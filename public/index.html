<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>每日燃油期货 · 信息汇总分析</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0f141b;--bg2:#171e28;--card:#1c242f;--line:#2a3442;--txt:#e7edf5;--sub:#93a1b3;--accent:#3b82f6;--green:#22c55e;--red:#ef4444;--orange:#f97316;--yel:#eab308;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.topbar h1{font-size:18px;margin:0}.topbar .meta{font-size:12px;color:var(--sub)}
.btn{background:var(--accent);color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px}
.btn.gray{background:var(--line)}
.risk{border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;gap:14px;align-items:center;font-weight:600}
.risk .big{font-size:22px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.card .lbl{font-size:12px;color:var(--sub)}
.card .val{font-size:22px;font-weight:700;margin:4px 0}
.card .chg{font-size:13px}.up{color:var(--green)}.down{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.sec h2{font-size:14px;margin:0 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.sec h3{font-size:13px;margin:12px 0 6px}
canvas{width:100%!important}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right}
th{color:var(--sub);font-weight:600}
td.l,th.l{text-align:left}
.pill{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;margin-right:6px}
.p-blue{background:#1e3a5f;color:#8ec9ff}.p-red{background:#3a1e1e;color:#ff9f9f}.p-green{background:#12301c;color:#9fe0b5}
.narr{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:14px}
.narr h2{font-size:16px;margin:0 0 10px}
.narr p{margin:8px 0}
.advice{background:#12301c;border:1px solid #1f5c33;border-radius:8px;padding:10px 12px;margin-top:10px}
.newsitem{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.newsitem a{color:var(--accent);text-decoration:none}
.src{font-size:11px;color:var(--sub)}
footer{margin-top:18px;color:var(--sub);font-size:12px;border-top:1px solid var(--line);padding-top:10px}
.center{text-align:center}.hide{display:none}
#posModal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:60}
#posModal.hide{display:none}
input,select{background:#0d131a;color:var(--txt);border:1px solid var(--line);padding:6px 8px;border-radius:6px}
.posform{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
label{font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:3px}
</style></head><body><div class="wrap">
<div class="topbar">
  <div><h1>⛽ 每日燃油期货 · 信息汇总分析</h1><div class="meta" id="meta"></div></div>
  <div style="display:flex;gap:8px">
    <button class="btn gray" onclick="openPos()">我的持仓</button>
    <button class="btn" onclick="load()">刷新</button>
  </div>
</div>
<div id="risk" class="risk"></div>
<div class="cards" id="cards"></div>
<div class="grid">
  <div class="sec"><h2>FU 主力 · 近60日收盘</h2><canvas id="cFu"></canvas></div>
  <div class="sec"><h2>FU 主力 · 日内 5m</h2><canvas id="cIntra"></canvas></div>
  <div class="sec"><h2>裂解价差 FU − SC×7.33 (元/吨)</h2><canvas id="cCrack"></canvas></div>
  <div class="sec"><h2>FU 期限结构 · 各月合约</h2><canvas id="cTerm"></canvas><div id="termsum"></div></div>
  <div class="sec"><h2>相关品种 · 近60日收盘</h2><canvas id="cRel"></canvas></div>
  <div class="sec"><h2>技术面/关键位</h2><div id="tech"></div></div>
  <div class="sec"><h2>产业链价差</h2><div id="spreads"></div></div>
  <div class="sec" style="grid-column:1/-1"><h2>日内"下探/上探"统计</h2><div id="dipsum"></div><div id="diptbl"></div></div>
  <div class="sec"><h2>🚨 霍尔木兹风险动态</h2><div id="hz"></div></div>
  <div class="sec"><h2>今日快讯</h2><div id="news" style="max-height:520px;overflow:auto"></div></div>
</div>
<div class="narr"><h2 id="ntitle"></h2><div id="nbody"></div><div id="nadv"></div></div>
<footer id="foot"></footer>
</div>

<div id="posModal" class="hide">
 <div class="sec" style="width:min(440px,92vw)">
  <h2>我的持仓（纳入 AI 解读与操作建议）</h2>
  <form class="posform" onsubmit="savePos(event)">
    <label>方向<select id="p_dir"><option value="long">多</option><option value="short">空</option></select></label>
    <label>购入价<input id="p_entry" type="number" step="1" placeholder="如 3900"></label>
    <label>手数<input id="p_qty" type="number" step="1" value="1"></label>
    <label>购入日期<input id="p_date" type="date"></label>
    <button class="btn" type="submit">保存</button>
    <button class="btn gray" type="button" onclick="closePos()">取消</button>
  </form>
 </div>
</div>

<script>
const $=id=>document.getElementById(id);
const fmt=v=>v==null||isNaN(v)?'—':(+v).toLocaleString('zh-CN');
const pct=v=>v==null||isNaN(v)?'—':(v>=0?'+':'')+(+v).toFixed(2)+'%';
const chg=v=>v==null||isNaN(v)?'':(v>=0?'up':'down');
let REPORT=null, charts={};
function posQuery(){ const p=JSON.parse(localStorage.getItem('fu_position')||'null'); if(!p)return''; return '&direction='+encodeURIComponent(p.direction||'long')+'&entry='+encodeURIComponent(p.entry)+'&qty='+encodeURIComponent(p.qty||1); }
async function load(){
  $('meta').textContent='加载中…'; try{
    const r=await fetch('/api/data?__='+Date.now()+posQuery()); const d=await r.json(); REPORT=d; render();
  }catch(e){ $('meta').textContent='加载失败：'+e.message; }
}
function render(){
  const q=REPORT.quotes||{}, m=REPORT.meta||{};
  $('meta').textContent=m.generatedAt+' · 北京时间 · 数据截止 '+m.dataCutoff+' · '+m.marketStatus+' · 耗时'+m.timeCostMs+'ms';
  // risk
  const rk=REPORT.risk?.hormuz?.level||{label:'绿色 · 平静',color:'#22c55e'};
  $('risk').style.background=rk.color+'22'; $('risk').style.border='1px solid '+rk.color;
  $('risk').innerHTML='<span class="big">🚨 霍尔木兹风险</span><span style="font-size:20px;color:'+rk.color+'">'+rk.label+'</span><span class="sub" style="color:var(--sub);font-weight:400">风险评分 '+REPORT.risk.hormuz.score+' / 相关快讯 '+(REPORT.risk.hormuz.items||[]).length+' 条</span>';
  // cards
  const cards=[ ['fu','燃料油主力'],['sc','原油主力'],['lu','低硫燃料油'],['brent','布伦特'],['wti','WTI'] ];
  $('cards').innerHTML=cards.map(([k,l])=>{ const x=q[k]; if(!x)return''; let ses=''; if(x.overnightPct!=null && k==='fu') ses='<div class="lbl">夜盘开盘 '+pct(x.overnightPct)+' · 日内 '+pct(x.intradayPct)+'</div>'; return '<div class="card"><div class="lbl">'+l+'</div><div class="val">'+fmt(x.latest)+'</div><div class="chg '+chg(x.changePct)+'">'+pct(x.changePct)+'</div><div class="lbl">量 '+fmt(x.vol)+' · 仓 '+fmt(x.hold)+'</div>'+ses+'</div>'; }).join('');
  // 逐块渲染，单块失败不影响其余
  [renderCharts, renderTerm, renderTech, renderSpreads, renderDip, renderHz, renderNews].forEach(fn=>{ try{ fn(); }catch(e){ console.error('section err', e); } });
  renderNarr();
}
function mkChart(id,labels,vals,opt={}){ const el=$(id); if(!el||!window.Chart)return; if(charts[id])charts[id].destroy(); charts[id]=new Chart(el,{type:opt.type||'line',data:{labels,datasets:opt.datasets},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{display:opt.legend!==false,labels:{color:'#93a1b3',font:{size:10}}}},scales:{x:{ticks:{color:'#93a1b3',maxTicksLimit:8,font:{size:9}}},y:{ticks:{color:'#93a1b3',font:{size:9}}}}}}); }
function renderCharts(){
  const c=REPORT.charts||{};
  const line=(data,color,label)=>{ const ds={data:data.map(x=>x.close),borderColor:color,backgroundColor:color+'22',fill:true,tension:.25,pointRadius:0,borderWidth:1.5,label}; const labels=data.map(x=>x.date? x.date.slice(5) : (x.time? String(x.time).slice(11,16) : '')); return {labels,ds}; };
  if(c.fu?.length){ const {labels,ds}=line(c.fu,'#3b82f6','FU收盘'); mkChart('cFu',labels,[ds]); }
  if(c.intraday?.length){ const {labels,ds}=line(c.intraday,'#22c55e','价格'); mkChart('cIntra',labels,[ds]); }
  if(c.spreads?.length){ const labels=c.spreads.map(x=>x.date.slice(5)); const ds={data:c.spreads.map(x=>x.crackFU),borderColor:'#f97316',backgroundColor:'#f9731622',fill:true,tension:.2,pointRadius:0,label:'crackFU'}; mkChart('cCrack',labels,[ds]); }
  const rel=[]; if(c.sc?.length)rel.push(['#22c55e','SC',c.sc]); if(c.lu?.length)rel.push(['#a855f7','LU',c.lu]); if(c.brent?.length)rel.push(['#eab308','Brent',c.brent]); if(c.wti?.length)rel.push(['#f43f5e','WTI',c.wti]);
  if(rel.length){ const labels=rel[0][2].map(x=>x.date.slice(5)); const dss=rel.map(([color,label,arr])=>({data:arr.map(x=>x.close),borderColor:color,backgroundColor:color+'11',pointRadius:0,label,borderWidth:1.5})); mkChart('cRel',labels,dss); }
}
function renderTerm(){ const t=REPORT.term; if(!t){$('termsum').innerHTML='';return;} const tm=t.curve||[]; if(tm.length){ if(charts['cTerm'])charts['cTerm'].destroy(); charts['cTerm']=new Chart($('cTerm'),{type:'bar',data:{labels:tm.map(c=>c.month),datasets:[{label:'FU价格',data:tm.map(c=>c.price),backgroundColor:'#3b82f6'}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#93a1b3',font:{size:9}}},y:{ticks:{color:'#93a1b3',font:{size:9}}}}}}); } const mk=(tm.find(c=>c.month===t.mainMonth)||{}); $('termsum').innerHTML='<div class="lbl">'+t.direction+' · 主力 '+t.mainMonth+'（'+fmt(mk.price)+'） · 近-远月差 '+fmt(t.nearFarSpread)+' 元/吨'+(t.note?' · '+t.note:'')+'</div>'; }
function renderTech(){ const t=REPORT.trend?.fu; if(!t){$('tech').innerHTML='<div class="lbl">暂无</div>';return;}
 $('tech').innerHTML='<table><tr><td class="l">方向</td><td>'+t.direction+'</td></tr>'+
 '<tr><td class="l">收盘/涨跌</td><td>'+fmt(t.close)+' · '+pct(t.changePct)+'</td></tr>'+
 '<tr><td class="l">MA5/10/20/60</td><td>'+fmt(t.ma5)+' / '+fmt(t.ma10)+' / '+fmt(t.ma20)+' / '+fmt(t.ma60??'')+'</td></tr>'+
 '<tr><td class="l">RSI(14)</td><td>'+fmt(t.rsi)+'（'+t.rsiState+'）</td></tr>'+
 '<tr><td class="l">ATR(14)</td><td>'+fmt(t.atr)+'</td></tr>'+
 '<tr><td class="l">振幅</td><td>'+t.amplitude+'%</td></tr>'+
 '<tr><td class="l">近20日区间</td><td>'+fmt(t.low20)+' ~ '+fmt(t.high20)+'</td></tr>'+
 '<tr><td class="l">区间分位</td><td>'+t.pos20+'%</td></tr>'+
 '<tr><td class="l">支撑/压力</td><td>'+fmt(t.support)+' / '+fmt(t.resistance)+'</td></tr></table>';
}
function renderSpreads(){ const s=REPORT.spreads; if(!s){$('spreads').innerHTML='<div class="lbl">暂无</div>';return;}
 $('spreads').innerHTML='<table><tr><td class="l">裂解 FU−SC</td><td>'+fmt(s.crackFU)+' 元/吨</td></tr>'+
 '<tr><td class="l">裂解 LU−SC</td><td>'+fmt(s.crackLU)+' 元/吨</td></tr>'+
 '<tr><td class="l">高低硫 LU−FU</td><td>'+fmt(s.lsSpread)+'（'+pct(s.lsSpread_pct)+'）</td></tr>'+
 '<tr><td class="l">SC 元/吨(×7.33)</td><td>'+fmt(s.scPerTonne)+'</td></tr>'+
 '<tr><td class="l">布伦特−WTI</td><td>'+fmt(s.brentWti)+'</td></tr></table><div class="lbl" style="margin-top:6px">'+s.note+'</div>';
}
function renderDip(){ const d=REPORT.dipspike; if(!d){$('dipsum').innerHTML='<div class="lbl">暂无分钟线</div>';$('diptbl').innerHTML='';return;}
 const s7=d.sum7,s30=d.sum30;
 $('dipsum').innerHTML='<table><tr><th>窗口</th><th>覆盖</th><th>下探</th><th>上探</th><th>合计</th><th>日均</th><th>下探均深</th><th>下探最深</th><th>上探均深</th><th>上探最深</th></tr>'+
 '<tr><td class="l">7日(5m)</td><td>'+s7.days+'</td><td>'+s7.dipN+'</td><td>'+s7.spikeN+'</td><td>'+s7.total+'</td><td>'+ (s7.days?(s7.total/s7.days).toFixed(1):'—')+'</td><td>'+s7.dipAvgDepth+'%</td><td>'+s7.dipMaxDepth+'%</td><td>'+s7.spikeAvgDepth+'%</td><td>'+s7.spikeMaxDepth+'%</td></tr>'+
 '<tr><td class="l">30日(15m)</td><td>'+s30.days+'</td><td>'+s30.dipN+'</td><td>'+s30.spikeN+'</td><td>'+s30.total+'</td><td>'+ (s30.days?(s30.total/s30.days).toFixed(1):'—')+'</td><td>'+s30.dipAvgDepth+'%</td><td>'+s30.dipMaxDepth+'%</td><td>'+s30.spikeAvgDepth+'%</td><td>'+s30.spikeMaxDepth+'%</td></tr></table>';
 // 7日/30日/60日 每日表
 function tbl(res,dates){ let h='<table><tr><th>日期</th><th>K线</th><th>基准</th><th>下探次数</th><th>下探最深/均深</th><th>上探次数</th><th>上探最深/均深</th><th>合计</th></tr>'; (dates||[]).forEach(date=>{ const r=res[date]; if(!r){h+='<tr><td class="l">'+date+'</td><td colspan="7">无</td></tr>';return;} const dips=r.dips||{n:0,max:0,avg:0},sps=r.spikes||{n:0,max:0,avg:0}; h+='<tr><td class="l">'+date+'</td><td>'+r.gran+'</td><td>'+fmt(r.baseline)+'</td><td>'+dips.n+'</td><td>'+dips.max+'/'+dips.avg+'</td><td>'+sps.n+'</td><td>'+sps.max+'/'+sps.avg+'</td><td>'+(dips.n+sps.n)+'</td></tr>';}); return h+'</table>'; }
 $('diptbl').innerHTML='<h3>近7天（5分钟，阈值0.1%，日盘9:00-15:00）</h3>'+tbl(d.w7,d.last7)+'<h3>近30天（15分钟）</h3>'+tbl(d.w30,d.last30)+'<h3>近60天（15分钟精确/日线近似）</h3>'+tbl(d.w60,d.last60);
}
function renderHz(){ const items=REPORT.risk?.hormuz?.items||[]; if(!items.length){$('hz').innerHTML='<div class="lbl">当前暂无霍尔木兹/伊朗/美伊相关快讯</div>';return;}
 $('hz').innerHTML=items.map(it=>'<div class="newsitem"><span class="src">'+esc(it.source)+' · '+(it.time||'')+'</span>'+(it.sentiment?' <span class="pill p-red">'+esc(it.sentiment)+'</span>':'')+' <a target="_blank" href="'+esc(it.url||'#')+'">'+esc(it.title||it.content).slice(0,120)+'</a></div>').join('');
}
function renderNews(){ const l=REPORT.news||[]; if(!l.length){$('news').innerHTML='<div class="lbl">暂无快讯（源可能暂时不可用）</div>';return;}
 $('news').innerHTML=l.map(it=>{ const col=it.sentiment==='利空'?'#f87171':it.sentiment==='利多'?'#4ade80':'#93a1b3'; return '<div class="newsitem"><div>'+(it.sentiment?'<span class="pill" style="background:'+col+'22;color:'+col+'">'+esc(it.sentiment)+'</span>':'')+esc(it.title||it.content).slice(0,150)+'</div><div class="src">'+esc(it.source)+' · '+(it.time||'')+(it.url?' · <a target="_blank" href="'+esc(it.url)+'">原文</a>':'')+'</div></div>'; }).join('');
}
function renderNarr(){ const n=REPORT.narrative||{}; $('ntitle').textContent=(n.ai?'🤖 AI 综合解读与预判 · ':'📊 规则化解读 · ')+(n.title||''); $('nbody').innerHTML=(n.paragraphs||[]).map(p=>'<p>'+esc(p)+'</p>').join('');
 const adv=REPORT.position?.advice; if(adv) $('nadv').innerHTML='<div class="advice">💡 持仓建议：'+esc(adv)+'</div>'; else $('nadv').innerHTML='';
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// position
function openPos(){ const p=JSON.parse(localStorage.getItem('fu_position')||'null'); if(p){$('p_dir').value=p.direction||'long';$('p_entry').value=p.entry;$('p_qty').value=p.qty||1;$('p_date').value=p.date||'';} $('posModal').classList.remove('hide'); }
function closePos(){ $('posModal').classList.add('hide'); }
function savePos(e){ e.preventDefault(); try{ const entry=parseFloat($('p_entry').value); if(!entry||isNaN(entry)){ alert('请输入有效的购入价'); return; } const p={direction:$('p_dir').value, entry:entry, qty:parseInt($('p_qty').value)||1, date:$('p_date').value}; localStorage.setItem('fu_position',JSON.stringify(p)); closePos(); load(); }catch(err){ alert('保存失败：'+err.message); } }
load();
</script>
</body></html>
