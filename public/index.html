<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>每日燃油期货 · 信息汇总分析</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root{--bg:#efebe2;--card:#ffffff;--line:#ddd6c8;--ink:#202020;--navy:#04338a;--coral:#fc3619;--orange:#ff682c;--muted:#7a756b;--sub:#7a756b;--green:#12855b;--red:#c62828;--shadow:0 2px 12px rgba(32,32,32,.07)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Inter',sans-serif;letter-spacing:-.01em}
.wrap{max-width:1280px;margin:0 auto;padding:20px}
.site-header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:22px 26px;background:var(--navy);color:#fff;border-radius:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.site-header .brand{display:flex;gap:14px;align-items:center}
.site-header .logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--coral),var(--orange));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff;flex:none}
.site-header h1{font-size:20px;margin:0;color:#fff}
.site-header .subtitle{font-size:12px;color:#c9d4ef;margin-top:2px}
.site-header .meta{font-size:12px;color:#c9d4ef;margin-top:6px}
.hrow{display:flex;gap:8px;flex-wrap:wrap}
.ticker{background:var(--ink);color:#fff;border-radius:12px;padding:12px 18px;display:flex;gap:26px;overflow-x:auto;white-space:nowrap;margin-bottom:18px;font-size:13px}
.ticker .tk{display:inline-flex;gap:7px;align-items:center}
.ticker .tk b{color:#fff;font-weight:600}
.ticker .tk em{font-style:normal;font-weight:700;font-size:14px}
.btn{background:var(--coral);color:#fff;border:none;padding:10px 18px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;font-family:inherit}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn.gray{background:#e9e3d6;color:var(--ink)}
.btn.ghost{background:rgba(255,255,255,.16);color:#fff}
.risk{border-radius:14px;padding:16px 22px;margin-bottom:18px;display:flex;gap:16px;align-items:center;font-weight:600;border:1px solid;box-shadow:var(--shadow);background:#fff;flex-wrap:wrap}
.risk .big{font-size:22px}
.risk .label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.card .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.card .val{font-size:27px;font-weight:800;margin:6px 0 2px;color:var(--ink)}
.card .chg{font-size:13px;font-weight:700}
.up{color:var(--green)}.down{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.sec h2{font-size:12px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);color:var(--navy);font-weight:700;letter-spacing:.06em;position:relative;text-transform:uppercase}
.sec h2::after{content:"";position:absolute;left:0;bottom:-1px;width:46px;height:3px;background:linear-gradient(90deg,var(--coral),var(--orange));border-radius:2px}
.sec h3{font-size:13px;margin:14px 0 8px;color:var(--navy)}
canvas{width:100%!important}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:right}
th{color:var(--muted);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.04em}
td.l,th.l{text-align:left}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;margin-right:6px;font-weight:600}
.p-blue{background:#e3ecf8;color:var(--navy)}.p-red{background:#fde4e0;color:var(--red)}.p-green{background:#dff0e8;color:var(--green)}
.narr{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-top:18px;box-shadow:var(--shadow)}
.narr h2{font-size:18px;margin:0 0 12px;color:var(--navy)}
.narr p{margin:10px 0;line-height:1.7}
#nbody h1,#nbody h2,#nbody h3{font-size:15px;color:var(--navy);margin:16px 0 6px;font-weight:700}
#nbody h2{font-size:16px}
#nbody ul,#nbody ol{margin:8px 0 8px 20px;padding:0}
#nbody li{margin:5px 0}
#nbody table{margin:10px 0;border-collapse:collapse;width:100%}
#nbody table th,#nbody table td{border:1px solid var(--line);padding:6px 9px;font-size:12px;text-align:left}
#nbody table th{background:#f2ede2;font-weight:700;color:var(--navy)}
#nbody code{background:#f0ece2;padding:2px 6px;border-radius:4px;font-size:12px}
#nbody strong{color:var(--navy)}
#nbody blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid var(--coral);background:#f7f2e7;border-radius:6px;color:#5a554b}
.advice{background:linear-gradient(120deg,#0f2f63,var(--navy));color:#fff;border-radius:16px;padding:22px 24px;margin-top:16px;position:relative;box-shadow:0 12px 32px rgba(4,51,138,.28);border:1px solid rgba(255,255,255,.12)}
.advice::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(180deg,var(--coral),var(--orange));border-radius:16px 0 0 16px}
.advice .adv-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#c9d4ef;margin-bottom:8px;font-weight:700}
.advice .adv-text{font-size:19px;font-weight:700;line-height:1.5}
.adv-tbl{margin-top:14px;overflow-x:auto}
.adv-tbl table{width:100%;border-collapse:collapse}
.adv-tbl table th,.adv-tbl table td{border-bottom:1px solid var(--line);padding:9px;font-size:12px}
.adv-tbl table th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.newsitem{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.newsitem a{color:var(--navy);text-decoration:none;font-weight:600}
.newsitem a:hover{text-decoration:underline}
.src{font-size:11px;color:var(--muted)}
footer{margin-top:20px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:12px}
.hide{display:none}
#posModal{position:fixed;inset:0;background:rgba(16,20,26,.55);display:flex;align-items:center;justify-content:center;z-index:60}
#posModal.hide{display:none}
#posModal .sec{width:min(640px,94vw);max-height:88vh;overflow:auto}
input,select{background:#fff;color:var(--ink);border:1px solid var(--line);padding:8px 10px;border-radius:10px;font-family:inherit;font-size:13px}
.posrow{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.posrow select,.posrow input{flex:1;min-width:70px;font-size:13px}
label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
@media(max-width:720px){
  body{font-size:13px}
  .wrap{padding:12px}
  .site-header{flex-direction:column;align-items:flex-start;padding:16px 18px}
  .site-header h1{font-size:18px}
  .site-header .subtitle{font-size:11px}
  .hrow{width:100%}
  .ticker{gap:16px;font-size:12px;padding:10px 14px}
  .grid{grid-template-columns:1fr;gap:12px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .card .val{font-size:22px}
  .sec,.narr{padding:14px}
  .narr{width:100%}
  .risk{padding:14px;gap:10px;font-size:13px}
  #dipsum,#diptbl,#nbody,#tech,#spreads,.adv-tbl{overflow-x:auto}
  table{font-size:11px}
  th,td{padding:6px 7px}
  .advice{padding:16px 18px}
  .advice .adv-text{font-size:15px}
  #posModal .sec{width:96vw;max-height:84vh}
  #nbody table{font-size:11px}
}
</style></head><body><div class="wrap">
<header class="site-header">
  <div class="brand">
    <div class="logo">FU</div>
    <div>
      <h1>每日燃油期货 · 信息汇总分析</h1>
      <div class="subtitle">FU 燃料油主力 · 联动 SC / LU / Brent / WTI · 霍尔木兹风险 · AI 解读</div>
      <div class="meta" id="meta"></div>
    </div>
  </div>
  <div class="hrow">
    <button class="btn ghost" onclick="openPos()">我的持仓</button>
    <button class="btn" onclick="load()">刷新</button>
  </div>
</header>
<div class="ticker" id="ticker"><span class="lbl">加载中…</span></div>
<div id="risk" class="risk"></div>
<div class="cards" id="cards"></div>
<div class="grid">
  <div class="sec"><h2>FU 主力 · 近60日收盘</h2><canvas id="cFu"></canvas></div>
  <div class="sec"><h2>FU 主力 · 日内 5m</h2><canvas id="cIntra"></canvas></div>
  <div class="sec"><h2>裂解价差 FU − SC×7.33 (元/吨)</h2><canvas id="cCrack"></canvas></div>
  <div class="sec"><h2>FU 期限结构 · 各月合约</h2><canvas id="cTerm"></canvas><div id="termsum"></div></div>
  <div class="sec"><h2>相关品种 · 近60日收盘</h2><canvas id="cRel"></canvas></div>
  <div class="sec"><h2>技术面 / 关键位</h2><div id="tech"></div></div>
  <div class="sec"><h2>产业链价差</h2><div id="spreads"></div></div>
  <div class="sec" style="grid-column:1/-1"><h2>日内"下探/上探"统计</h2><div id="dipsum"></div><div id="diptbl"></div></div>
  <div class="sec"><h2>霍尔木兹 · 风险动态</h2><div id="hz"></div></div>
  <div class="sec"><h2>今日快讯</h2><div id="news" style="max-height:520px;overflow:auto"></div></div>
</div>
<div class="narr"><h2 id="ntitle"></h2><div id="nbody"></div><div id="nadv"></div></div>
<footer id="foot"></footer>
</div>

<div id="posModal" class="hide">
 <div class="sec">
  <h2>我的持仓（可多笔，纳入 AI 解读与操作建议）</h2>
  <div id="posRows"></div>
  <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
    <button class="btn gray" type="button" onclick="addPosRow()">＋ 加一笔</button>
    <button class="btn" onclick="savePos()">保存</button>
    <button class="btn gray" type="button" onclick="closePos()">取消</button>
  </div>
  <div class="lbl" style="margin-top:8px">方向 / 购入价 / 手数(FU 1手=10吨) / 购入日期。保存后自动刷新，下方给出每笔+整体持仓建议。</div>
 </div>
</div>

<script>
const $=id=>document.getElementById(id);
const fmt=v=>v==null||isNaN(v)?'—':(+v).toLocaleString('zh-CN');
const pct=v=>v==null||isNaN(v)?'—':(v>=0?'+':'')+(+v).toFixed(2)+'%';
const chg=v=>v==null||isNaN(v)?'':(v>=0?'up':'down');
let REPORT=null, charts={};
function posQuery(){ const arr=JSON.parse(localStorage.getItem('fu_positions')||'[]'); if(!Array.isArray(arr))return''; const clean=arr.filter(p=>p&&+p.entry).map(p=>({direction:p.direction||'long',entry:+p.entry,qty:+p.qty||1,date:p.date||''})); if(!clean.length)return''; return '&positions='+encodeURIComponent(JSON.stringify(clean)); }
async function load(){
  $('meta').textContent='加载中…'; try{
    const r=await fetch('/api/data?__='+Date.now()+posQuery()); const d=await r.json(); REPORT=d; render();
  }catch(e){ $('meta').textContent='加载失败：'+e.message; }
}
function renderTickerF(){ const q=REPORT&&REPORT.quotes; const tk=$('ticker'); if(!q||!tk) return; const items=[['FU燃料油','fu'],['SC原油','sc'],['LU低硫','lu'],['布伦特','brent'],['WTI','wti']].filter(([,k])=>q[k]).map(([n,k])=>{ const x=q[k]; return '<span class="tk"><b>'+n+'</b> '+fmt(x.latest)+' <em class="'+chg(x.changePct)+'">'+pct(x.changePct)+'</em></span>'; }); if(items.length) tk.innerHTML=items.join(''); }
function render(){
  const q=REPORT.quotes||{}, m=REPORT.meta||{};
  $('meta').textContent=m.generatedAt+' · 北京时间 · 数据截止 '+m.dataCutoff+' · '+m.marketStatus+' · 耗时'+m.timeCostMs+'ms';
  // risk
  const rk=REPORT.risk?.hormuz?.level||{label:'绿色 · 平静',color:'#12855b'};
  $('risk').style.background=rk.color+'1a'; $('risk').style.border='1px solid '+rk.color;
  $('risk').innerHTML='<span class="big" style="color:'+rk.color+'">◆</span><div><div class="label">霍尔木兹风险</div><span style="font-size:20px;color:'+rk.color+'">'+rk.label+'</span></div><span class="sub" style="color:var(--muted);font-weight:400">风险评分 '+REPORT.risk.hormuz.score+' / 相关快讯 '+(REPORT.risk.hormuz.items||[]).length+' 条</span>';
  // cards
  const cards=[ ['fu','燃料油主力'],['sc','原油主力'],['lu','低硫燃料油'],['brent','布伦特'],['wti','WTI'] ];
  $('cards').innerHTML=cards.map(([k,l])=>{ const x=q[k]; if(!x)return''; let ses=''; if(x.overnightPct!=null && k==='fu') ses='<div class="lbl">夜盘开盘 '+pct(x.overnightPct)+' · 日内 '+pct(x.intradayPct)+'</div>'; return '<div class="card"><div class="lbl">'+l+'</div><div class="val">'+fmt(x.latest)+'</div><div class="chg '+chg(x.changePct)+'">'+pct(x.changePct)+'</div><div class="lbl">量 '+fmt(x.vol)+' · 仓 '+fmt(x.hold)+'</div>'+ses+'</div>'; }).join('');
  renderTickerF();
  // 逐块渲染，单块失败不影响其余
  [renderCharts, renderTerm, renderTech, renderSpreads, renderDip, renderHz, renderNews].forEach(fn=>{ try{ fn(); }catch(e){ console.error('section err', e); } });
  renderNarr();
}
function mkChart(id,labels,vals,opt={}){ const el=$(id); if(!el||!window.Chart)return; if(charts[id])charts[id].destroy(); charts[id]=new Chart(el,{type:opt.type||'line',data:{labels,datasets:opt.datasets},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{display:opt.legend!==false,labels:{color:'#8f887c',font:{size:10}}}},scales:{x:{ticks:{color:'#8f887c',maxTicksLimit:8,font:{size:9}}},y:{ticks:{color:'#8f887c',font:{size:9}}}}}}); }
function renderCharts(){
  const c=REPORT.charts||{};
  const line=(data,color,label)=>{ const ds={data:data.map(x=>x.close),borderColor:color,backgroundColor:color+'22',fill:true,tension:.25,pointRadius:0,borderWidth:1.5,label}; const labels=data.map(x=>x.date? x.date.slice(5) : (x.time? String(x.time).slice(11,16) : '')); return {labels,ds}; };
  if(c.fu?.length){ const {labels,ds}=line(c.fu,'#04338a','FU收盘'); mkChart('cFu',labels,[ds]); }
  if(c.intraday?.length){ const {labels,ds}=line(c.intraday,'#ff682c','价格'); mkChart('cIntra',labels,[ds]); }
  if(c.spreads?.length){ const labels=c.spreads.map(x=>x.date.slice(5)); const ds={data:c.spreads.map(x=>x.crackFU),borderColor:'#fc3619',backgroundColor:'#fc361922',fill:true,tension:.2,pointRadius:0,label:'crackFU'}; mkChart('cCrack',labels,[ds]); }
  const rel=[]; if(c.sc?.length)rel.push(['#04338a','SC',c.sc]); if(c.lu?.length)rel.push(['#7a4fbf','LU',c.lu]); if(c.brent?.length)rel.push(['#d97706','Brent',c.brent]); if(c.wti?.length)rel.push(['#c2410c','WTI',c.wti]);
  if(rel.length){ const labels=rel[0][2].map(x=>x.date.slice(5)); const dss=rel.map(([color,label,arr])=>({data:arr.map(x=>x.close),borderColor:color,backgroundColor:color+'11',pointRadius:0,label,borderWidth:1.5})); mkChart('cRel',labels,dss); }
}
function renderTerm(){ const t=REPORT.term; if(!t){$('termsum').innerHTML='';return;} const tm=t.curve||[]; if(tm.length){ if(charts['cTerm'])charts['cTerm'].destroy(); charts['cTerm']=new Chart($('cTerm'),{type:'bar',data:{labels:tm.map(c=>c.month),datasets:[{label:'FU价格',data:tm.map(c=>c.price),backgroundColor:'#fc3619'}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8f887c',font:{size:9}}},y:{ticks:{color:'#8f887c',font:{size:9}}}}}}); } const mk=(tm.find(c=>c.month===t.mainMonth)||{}); $('termsum').innerHTML='<div class="lbl">'+t.direction+' · 主力 '+t.mainMonth+'（'+fmt(mk.price)+'） · 近-远月差 '+fmt(t.nearFarSpread)+' 元/吨'+(t.note?' · '+t.note:'')+'</div>'; }
function renderTech(){ const t=REPORT.trend?.fu; if(!t){$('tech').innerHTML='<div class="lbl">暂无</div>';return;}
 $('tech').innerHTML='<table><tr><td class="l">方向</td><td>'+t.direction+'</td></tr>'+'<tr><td class="l">收盘/涨跌</td><td>'+fmt(t.close)+' · '+pct(t.changePct)+'</td></tr>'+'<tr><td class="l">MA5/10/20/60</td><td>'+fmt(t.ma5)+' / '+fmt(t.ma10)+' / '+fmt(t.ma20)+' / '+fmt(t.ma60??'')+'</td></tr>'+'<tr><td class="l">RSI(14)</td><td>'+fmt(t.rsi)+'（'+t.rsiState+'）</td></tr>'+'<tr><td class="l">ATR(14)</td><td>'+fmt(t.atr)+'</td></tr>'+'<tr><td class="l">振幅</td><td>'+t.amplitude+'%</td></tr>'+'<tr><td class="l">近20日区间</td><td>'+fmt(t.low20)+' ~ '+fmt(t.high20)+'</td></tr>'+'<tr><td class="l">区间分位</td><td>'+t.pos20+'%</td></tr>'+'<tr><td class="l">支撑/压力</td><td>'+fmt(t.support)+' / '+fmt(t.resistance)+'</td></tr></table>';
}
function renderSpreads(){ const s=REPORT.spreads; if(!s){$('spreads').innerHTML='<div class="lbl">暂无</div>';return;}
 $('spreads').innerHTML='<table><tr><td class="l">裂解 FU−SC</td><td>'+fmt(s.crackFU)+' 元/吨</td></tr>'+'<tr><td class="l">裂解 LU−SC</td><td>'+fmt(s.crackLU)+' 元/吨</td></tr>'+'<tr><td class="l">高低硫 LU−FU</td><td>'+fmt(s.lsSpread)+'（'+pct(s.lsSpread_pct)+'）</td></tr>'+'<tr><td class="l">SC 元/吨(×7.33)</td><td>'+fmt(s.scPerTonne)+'</td></tr>'+'<tr><td class="l">布伦特−WTI</td><td>'+fmt(s.brentWti)+'</td></tr></table><div class="lbl" style="margin-top:6px">'+s.note+'</div>';
}
function renderDip(){ const d=REPORT.dipspike; if(!d){$('dipsum').innerHTML='<div class="lbl">暂无分钟线</div>';$('diptbl').innerHTML='';return;}
 const s7=d.sum7,s30=d.sum30;
 $('dipsum').innerHTML='<table><tr><th>窗口</th><th>覆盖</th><th>下探</th><th>上探</th><th>合计</th><th>日均</th><th>下探均深</th><th>下探最深</th><th>上探均深</th><th>上探最深</th></tr>'+'<tr><td class="l">7日(5m)</td><td>'+s7.days+'</td><td>'+s7.dipN+'</td><td>'+s7.spikeN+'</td><td>'+s7.total+'</td><td>'+ (s7.days?(s7.total/s7.days).toFixed(1):'—')+'</td><td>'+s7.dipAvgDepth+'%</td><td>'+s7.dipMaxDepth+'%</td><td>'+s7.spikeAvgDepth+'%</td><td>'+s7.spikeMaxDepth+'%</td></tr>'+'<tr><td class="l">30日(15m)</td><td>'+s30.days+'</td><td>'+s30.dipN+'</td><td>'+s30.spikeN+'</td><td>'+s30.total+'</td><td>'+ (s30.days?(s30.total/s30.days).toFixed(1):'—')+'</td><td>'+s30.dipAvgDepth+'%</td><td>'+s30.dipMaxDepth+'%</td><td>'+s30.spikeAvgDepth+'%</td><td>'+s30.spikeMaxDepth+'%</td></tr></table>';
 function tbl(res,dates){ let h='<table><tr><th>日期</th><th>K线</th><th>基准</th><th>下探次数</th><th>下探最深/均深</th><th>上探次数</th><th>上探最深/均深</th><th>合计</th></tr>'; (dates||[]).forEach(date=>{ const r=res[date]; if(!r){h+='<tr><td class="l">'+date+'</td><td colspan="7">无</td></tr>';return;} const dips=r.dips||{n:0,max:0,avg:0},sps=r.spikes||{n:0,max:0,avg:0}; h+='<tr><td class="l">'+date+'</td><td>'+r.gran+'</td><td>'+fmt(r.baseline)+'</td><td>'+dips.n+'</td><td>'+dips.max+'/'+dips.avg+'</td><td>'+sps.n+'</td><td>'+sps.max+'/'+sps.avg+'</td><td>'+(dips.n+sps.n)+'</td></tr>';}); return h+'</table>'; }
 $('diptbl').innerHTML='<h3>近7天（5分钟，阈值0.1%，日盘9:00-15:00）</h3>'+tbl(d.w7,d.last7)+'<h3>近30天（15分钟）</h3>'+tbl(d.w30,d.last30)+'<h3>近60天（15分钟精确/日线近似）</h3>'+tbl(d.w60,d.last60);
}
function renderHz(){ const items=REPORT.risk?.hormuz?.items||[]; if(!items.length){$('hz').innerHTML='<div class="lbl">当前暂无霍尔木兹/伊朗/美伊相关快讯</div>';return;}
 $('hz').innerHTML=items.map(it=>'<div class="newsitem"><span class="src">'+esc(it.source)+' · '+(it.time||'')+'</span>'+(it.sentiment?' <span class="pill p-red">'+esc(it.sentiment)+'</span>':'')+' <a target="_blank" href="'+esc(it.url||'#')+'">'+esc(it.title||it.content).slice(0,120)+'</a></div>').join('');
}
function renderNews(){ const l=REPORT.news||[]; if(!l.length){$('news').innerHTML='<div class="lbl">暂无快讯（源可能暂时不可用）</div>';return;}
 $('news').innerHTML=l.map(it=>{ const col=it.sentiment==='利空'?'#c62828':it.sentiment==='利多'?'#12855b':'#7a756b'; return '<div class="newsitem"><div>'+(it.sentiment?'<span class="pill" style="background:'+col+'18;color:'+col+'">'+esc(it.sentiment)+'</span>':'')+esc(it.title||it.content).slice(0,150)+'</div><div class="src">'+esc(it.source)+' · '+(it.time||'')+(it.url?' · <a target="_blank" href="'+esc(it.url)+'">原文</a>':'')+'</div></div>'; }).join('');
}
function renderNarr(){ const n=REPORT.narrative||{}; $('ntitle').textContent=(n.ai?'🤖 AI 综合解读与预判 · ':'📊 规则化解读 · ')+(n.title||'');
  if(n.ai && window.marked){ try{ const md=(n.paragraphs||[]).join('\n'); $('nbody').innerHTML=window.marked.parse(md,{breaks:false}); }catch(e){ $('nbody').innerHTML=(n.paragraphs||[]).map(p=>'<p>'+esc(p)+'</p>').join(''); } }
  else $('nbody').innerHTML=(n.paragraphs||[]).map(p=>'<p>'+esc(p)+'</p>').join('');
  const agg=REPORT.position, items=REPORT.positions||[]; let h='';
  if(items && items.length){ h+='<div class="advice"><div class="adv-kicker">◆ 行动建议 · 我的持仓</div><div class="adv-text">'+esc((agg&&agg.overall)||'')+'</div></div><div class="adv-tbl"><table><tr><th class="l">方向</th><th>购入价</th><th>手数</th><th>现价</th><th>浮盈%</th><th class="l">建议</th></tr>'+items.map(x=>'<tr><td class="l">'+x.status+'</td><td>'+fmt(x.entry)+'</td><td>'+x.qty+'</td><td>'+fmt(x.latest)+'</td><td class="'+(x.pnlPct>=0?'up':'down')+'">'+pct(x.pnlPct)+'</td><td class="l">'+esc(x.advice)+'</td></tr>').join('')+'</table></div>'; }
  else if(agg && agg.overall) h+='<div class="advice"><div class="adv-kicker">◆ 行动建议</div><div class="adv-text">'+esc(agg.overall)+'</div></div>';
  $('nadv').innerHTML=h;
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function openPos(){ const arr=JSON.parse(localStorage.getItem('fu_positions')||'[]'); $('posRows').innerHTML=''; const list=(Array.isArray(arr)&&arr.length)?arr:[null]; list.forEach(p=>addPosRow(p)); $('posModal').classList.remove('hide'); }
function addPosRow(p){ const r=document.createElement('div'); r.className='posrow'; r.innerHTML='<select class="pd_dir"><option value="long">多</option><option value="short">空</option></select><input class="pd_entry" type="number" step="1" placeholder="购入价" value="'+(p&&p.entry||'')+'"><input class="pd_qty" type="number" step="1" value="'+(p&&p.qty||1)+'"><input class="pd_date" type="date" value="'+(p&&p.date||'')+'"><button class="btn gray" type="button" onclick="this.parentNode.remove()">移除</button>'; if(p&&p.direction==='short') r.querySelector('.pd_dir').value='short'; $('posRows').appendChild(r); }
function closePos(){ $('posModal').classList.add('hide'); }
function savePos(){ try{ const rows=[...document.querySelectorAll('#posRows .posrow')]; const arr=rows.map(row=>({direction:row.querySelector('.pd_dir').value, entry:+row.querySelector('.pd_entry').value, qty:parseInt(row.querySelector('.pd_qty').value)||1, date:row.querySelector('.pd_date').value})).filter(p=>+p.entry); if(!arr.length){ alert('请至少填写一笔记购入价'); return; } localStorage.setItem('fu_positions',JSON.stringify(arr)); closePos(); load(); }catch(err){ alert('保存失败：'+err.message); } }
load();
</script>
